<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lexi Lab — Évaluer la richesse de vocabulaire</title>
<link rel="stylesheet" href="css/style.css"></head>
<body>
<header><h1>Lexi Lab</h1><p class="subtitle">Évaluer la richesse de vocabulaire</p></header>
<main><div class="workspace">
<aside class="panel sidebar" aria-label="Résultat de l'analyse">
<div class="eyebrow">Indice de fréquence lexicale</div>
<div class="score" id="score" aria-live="polite">—</div>
<div class="track" role="img" aria-label="Jauge indicative du score"><div class="marker" id="marker"></div></div>
<div class="scale"><span>Vocabulaire fréquent</span><span>Plus rare</span></div>
<p class="note" id="gauge-note">Saisissez un texte pour commencer.</p>
</aside>
<section class="panel editor"><label for="input">Texte à analyser</label>
<textarea id="input" placeholder="Saisissez ou collez votre texte ici…"></textarea>
<div class="toolbar"><span style="font-size:12px;color:#68788a">Analyse locale · Lexique 4</span><button id="go" type="button">Analyser le texte</button></div>
</section></div>
<div class="hidden-diagnostics" aria-hidden="true">
<span id="lemmas"></span><span id="coverage"></span><span id="detail"></span>
<table><tbody id="table"></tbody></table><span id="uniques"></span>
</div></main>
<script src="js/app.js"></script>
<script>fetch("data/lexique.json").then(r=>{if(!r.ok)throw Error("Dictionnaire indisponible");return r.json()}).then(demarrerLexiLab).catch(e=>{console.error(e);document.getElementById("gauge-note").textContent="Erreur de chargement du dictionnaire.";document.getElementById("go").disabled=true})</script></body></html>
