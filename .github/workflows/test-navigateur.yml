name: Tester Lexi Lab dans Chromium
on:
  push:
    branches: [test-separation-donnees]
    paths: ['.github/workflows/test-navigateur.yml', 'scripts/test_navigateur.cjs']
permissions:
  contents: read
jobs:
  navigateur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifier presence du script
        run: |
          test -f scripts/test_navigateur.cjs
          test -f data/lexique.json
          test -f js/app.js
      - name: Installer Chromium et Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Tester le chargement et le calcul
        run: |
          python3 -m http.server 8765 &
          node scripts/test_navigateur.cjs
