name: Tester separation lexicale
on:
  push:
    branches: [test-separation-donnees]
    paths: ['.github/workflows/test-separation.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extraction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraire et verifier
        run: python scripts/separer_donnees.py
      - name: Verifier JavaScript
        run: node --check js/app.js
      - name: Verifier JSON
        run: python -m json.tool data/lexique.json > /dev/null
      - name: Enregistrer sur branche experimentale
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css/style.css js/app.js data/lexique.json
          git commit -m "Extraire les fichiers sans modifier les calculs"
          git push
